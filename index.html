<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #dde3ea;
    --border-strong: #c1cad6;
    --text: #21314d;
    --text-secondary: #57657a;
    --text-muted: #8a95a6;
    --accent: #21314d;
    --accent-light: #e7e8eb;
    --success: #1e6b3e;
    --success-light: #e6f3ea;
    --danger: #a3282d;
    --danger-light: #fbe9ea;
    --flag: #b9791a;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { touch-action: manipulation; }
  body {
    margin: 0;
    font-family: Helvetica, Arial, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .site-footer { border-top: 1px solid var(--border); margin-top: 40px; }
  .site-footer-inner {
    max-width: 960px; margin: 0 auto; padding: 18px 24px 28px;
    font-size: 12.5px; color: var(--text-muted); text-align: center;
  }
  .app { max-width: 760px; margin: 0 auto; padding: 24px; }
  .app.wide { max-width: 960px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
  }
  button {
    font-family: inherit; font-size: 14px; font-weight: 500; padding: 8px 14px;
    border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--card);
    color: var(--text); cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  @media (hover: hover) and (pointer: fine) {
    button:hover { background: var(--bg); }
    button.primary:hover { opacity: 0.9; }
  }
  button.small { padding: 5px 10px; font-size: 13px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .exam-card {
    display: flex; flex-direction: column; gap: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  @media (hover: hover) and (pointer: fine) {
    .exam-card:hover {
      border-color: var(--accent); box-shadow: 0 6px 16px rgba(33, 49, 77, 0.12); transform: translateY(-1px);
    }
  }
  .exam-card-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .random-exam-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .issue-wrap { position: relative; display: inline-flex; }
  .issue-btn {
    width: 24px; height: 24px; padding: 0; border-radius: 50%; font-weight: 600; font-size: 12px;
    border-color: var(--border-strong); color: var(--text-muted); background: none;
  }
  .issue-btn.active { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }
  @media (hover: hover) and (pointer: fine) {
    .issue-btn:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }
  }
  .issue-popover {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; width: 260px;
    background: var(--card); border: 1px solid var(--danger); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(20, 30, 45, 0.15); padding: 12px;
    font-size: 13px; line-height: 1.4; color: var(--text); text-align: left; font-weight: 400;
  }
  .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .category-card {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 16px 18px; border-radius: var(--radius);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  @media (hover: hover) and (pointer: fine) {
    .category-card:hover {
      border-color: var(--accent); box-shadow: 0 6px 16px rgba(33, 49, 77, 0.12); transform: translateY(-1px);
    }
  }
  .category-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .category-title { font-weight: 600; font-size: 16px; }
  .category-meta { font-size: 13px; color: var(--text-muted); }
  .semester-heading {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .semester-heading:first-of-type { margin-top: 0; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
  @keyframes skeleton-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .skeleton-block, .skeleton-card { background: var(--border); border-radius: var(--radius); animation: skeleton-pulse 1.4s ease-in-out infinite; }
  .skeleton-card { height: 72px; }
  .quiz-option {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius);
    margin-bottom: 8px; cursor: pointer; font-size: 14px;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  @media (hover: hover) and (pointer: fine) {
    .quiz-option:not(.locked):hover { background: var(--accent-light); }
  }
  .quiz-option.selected { border-color: var(--accent); background: var(--accent-light); }
  .quiz-option.locked { cursor: default; }
  .option-main { display: flex; align-items: center; flex: 1; min-width: 0; }
  .quiz-option input { margin-right: 10px; flex-shrink: 0; accent-color: var(--accent); }
  .quiz-option.correct-answer { border-color: var(--success); background: var(--success-light); }
  .quiz-option.incorrect-answer { border-color: var(--danger); background: var(--danger-light); }
  .quiz-option.crossed-out { cursor: not-allowed; }
  .quiz-option.crossed-out .option-main { text-decoration: line-through; color: var(--text-muted); opacity: 0.7; }
  .eye-toggle {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; border: none; background: transparent; color: var(--text-secondary);
  }
  @media (hover: hover) and (pointer: fine) {
    .eye-toggle:hover { background: var(--border); }
  }
  .eye-toggle.active { color: var(--accent); }
  .question-image { display: block; max-width: 100%; height: auto; margin: 4px 0 16px; }
  .fill-blank-row { margin-bottom: 12px; }
  .fill-blank-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; display: block; }
  .fill-blank-input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius);
    font-size: 14px; font-family: inherit; color: var(--text); background: var(--card);
  }
  .fill-blank-input:focus { outline: none; border-color: var(--accent); }
  .fill-blank-input.correct-answer { border-color: var(--success); background: var(--success-light); }
  .fill-blank-input.incorrect-answer { border-color: var(--danger); background: var(--danger-light); }
  .fill-blank-accepted { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .icon-btn { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0; font-size: 16px; line-height: 1; }
  .bare-icon {
    display: flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    padding: 0; font-size: 26px; line-height: 1; border: none; background: none; border-radius: var(--radius); color: var(--text);
  }
  @media (hover: hover) and (pointer: fine) {
    .bare-icon:hover { background: var(--bg); }
  }
  .flag-btn.active { color: var(--flag); }
  .qnav-wrap { margin-top: 20px; }
  .qnav {
    display: flex; flex-direction: row; align-items: center; gap: 10px;
    overflow-x: auto; overflow-y: hidden; padding: 2px 2px 8px;
    scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
  }
  .qnav::-webkit-scrollbar { height: 6px; }
  .qnav::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .qnav-btn {
    position: relative; flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; padding: 0; font-size: 13px;
    border: 1px solid var(--border-strong); background: var(--card); color: var(--text);
  }
  .qnav-btn.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
  .qnav-btn.correct { background: var(--success-light); border-color: var(--success); color: var(--success); }
  .qnav-btn.incorrect { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
  .qnav-btn.answered { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .qnav-btn.flagged::after {
    content: ''; position: absolute; top: -4px; right: -4px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--flag); border: 1px solid var(--card);
  }
  .options-wrap { position: relative; display: inline-block; }
  .options-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 230px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(20, 30, 45, 0.15); padding: 8px;
  }
  .options-menu-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 10px; border-radius: 6px; font-size: 14px; cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  @media (hover: hover) and (pointer: fine) {
    .options-menu-item:hover { background: var(--bg); }
  }
  .options-menu-divider { height: 1px; background: var(--border); margin: 6px 2px; }
  .toggle-switch { position: relative; width: 34px; height: 20px; border-radius: 10px; background: var(--border-strong); flex-shrink: 0; transition: background 0.15s; }
  .toggle-switch.on { background: var(--accent); }
  .toggle-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: left 0.15s;
  }
  .toggle-switch.on::after { left: 16px; }
  .menu-overlay { position: fixed; inset: 0; z-index: 20; }
  .score-big { font-size: 40px; font-weight: 600; text-align: center; margin: 10px 0; }
  .score-label { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .quiz-top-row { margin-bottom: 24px; }
  .back-btn {
    background: none; border: none; padding: 4px 0; margin: 0;
    color: var(--text-secondary); font-size: 13px; font-weight: 500;
  }
  @media (hover: hover) and (pointer: fine) {
    .back-btn:hover { background: none; color: var(--accent); }
  }
  .loading, .error-state { text-align: center; padding: 40px; color: var(--text-muted); }
  .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .footer-row-right { display: flex; align-items: center; gap: 12px; }
  .auto-next-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; }
</style>

<body>
<div class="app wide" id="app">
  <div class="loading">
    <div class="skeleton-block" style="width:180px; height:12px; margin-bottom:24px;"></div>
    <div class="skeleton-block" style="width:100px; height:11px; margin-bottom:10px;"></div>
    <div class="category-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>
</div>

<script>
const SCORES_KEY = 'exam_scores'; // local score history only — exam content itself comes from exams.json
const SETTINGS_KEY = 'exam_settings';
const PROGRESS_KEY = 'exam_progress'; // in-progress attempts, keyed by exam id, so an exam can be left and resumed
let exams = {};
let scores = {};
let progress = {};
let settings = { immediateGrading: true, autoNext: false, newCurriculumOnly: false };
const AUTO_NEXT_DELAY_MS = 600;
let view = { screen: 'home' };
let quizState = null;
let optionsMenuOpen = false;
let openIssuePopoverId = null;

function escapeHtml(str) {
  const d = document.createElement('div');
  d.innerText = str == null ? '' : str;
  return d.innerHTML;
}

const EYE_OPEN_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSED_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.86 21.86 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.86 21.86 0 0 1-3.22 4.55M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const MENU_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';

function isBlankFilled(alts, value) {
  const norm = (value || '').trim().toLowerCase();
  if (!norm) return false;
  return alts.some(a => a.trim().toLowerCase() === norm);
}

function isQuestionAnswered(q, ans) {
  if (q.type === 'fill') {
    return Array.isArray(ans) && q.blanks.every((_, bi) => (ans[bi] || '').trim() !== '');
  }
  return ans !== undefined;
}

function isQuestionCorrect(q, ans) {
  if (q.type === 'fill') {
    if (!Array.isArray(ans)) return false;
    return q.blanks.every((alts, bi) => isBlankFilled(alts, ans[bi]));
  }
  return ans === q.correct;
}

// Matches an option that is ENTIRELY a combination of letters, e.g. "A and B",
// "Both A and C", "A, B and C", "A, B, and C" (Oxford comma), "a,c and d only",
// "a. and b." / "A. B. and C." (period-separated) — the shape used when an option
// refers back to sibling options by their list position (e.g. option D = "B and C").
const COMPOUND_LETTER_OPTION_RE = /^(both\s+)?[a-h]\.?(\s*[,.]\s*(and|&)?\s*[a-h]\.?|\s*(and|&)\s*[a-h]\.?)+(\s+only)?\.?$/i;
// "All of the above/these/answer choices/options/statements..." and "None of the..."
// catch-all options — safe to shuffle in meaning, but read oddly unless they stay
// wherever they originally sat in the list.
const PINNED_OPTION_RE = /^(all|none)\s+of\s+(the|these)/i;

// A stem that itself spells out a lettered/numbered sub-list (e.g. "...molars have
// A) Two roots B) Crowns C) Lingual cusps") makes letter-combo options like "A and B"
// safe to shuffle, since they're anchored to fixed stem text rather than to sibling
// options' display positions. Require 2+ distinct markers so a stray "e.g." doesn't
// count as a one-item list.
function stemHasEnumeratedList(text) {
  const matches = text.match(/\b([a-h])[).]\s|\b([1-8])[).]\s/gi) || [];
  const distinct = new Set(matches.map(m => m.trim().replace(/[).]/g, '').toLowerCase()));
  return distinct.size >= 2;
}

// A "fixed truth-value menu" is a question where every option states a true/false
// (or correct/incorrect) verdict — bare "True"/"False", "Statement 1 is True.
// Statement 2 is False.", "Both statements are true", assertion-reason combos, etc.
// These read as a fixed combinatorial menu, so they should always appear in their
// original order rather than shuffle.
const TRUTH_VALUE_OPTION_RE = /\b(true|false|correct|incorrect)\b/i;
function isFixedTruthValueMenu(q) {
  return q.options.length >= 2 && q.options.every(o => TRUTH_VALUE_OPTION_RE.test(o));
}

// True when shuffling this question's options could change its meaning: an option
// like "B and C" only makes sense if B and C stay in their original list positions,
// unless those letters are independently defined in the question's own stem text.
function optionOrderIsUnsafe(q) {
  if (isFixedTruthValueMenu(q)) return true;
  if (stemHasEnumeratedList(q.text)) return false;
  return q.options.some(o => COMPOUND_LETTER_OPTION_RE.test(o.trim()));
}

function shuffledIndices(idx) {
  const copy = idx.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function buildOptionOrder(exam) {
  const order = {};
  exam.questions.forEach((q, qi) => {
    if (q.type === 'fill') return;
    const allIdx = q.options.map((_, oi) => oi);
    if (optionOrderIsUnsafe(q)) {
      order[qi] = allIdx;
      return;
    }
    const pinnedIdx = allIdx.filter(oi => PINNED_OPTION_RE.test(q.options[oi].trim()));
    const movableIdx = shuffledIndices(allIdx.filter(oi => !pinnedIdx.includes(oi)));
    const result = [];
    let mi = 0;
    allIdx.forEach(oi => {
      result.push(pinnedIdx.includes(oi) ? oi : movableIdx[mi++]);
    });
    order[qi] = result;
  });
  return order;
}

const RANDOM_EXAM_ID_PREFIX = '__random__';
const RANDOM_EXAM_QUESTION_COUNT = 50;
const NEW_CURRICULUM_MIN_YEAR = 2020; // a 2019 curriculum change makes older exams less relevant

function randomExamId(type, subtype) {
  return `${RANDOM_EXAM_ID_PREFIX}${type}__${subtype || 'none'}`;
}

function examYear(title) {
  const m = title.match(/\((Spring|Summer|Fall|Winter)\s+(\d{4})\)/i);
  return m ? parseInt(m[2], 10) : null;
}

function isNewCurriculumExam(exam) {
  const year = examYear(exam.title);
  return year != null && year >= NEW_CURRICULUM_MIN_YEAR;
}

// Pools every question from the real (non-random) exams in a folder, deduping
// questions that recur verbatim across exams (e.g. the same question reused
// in multiple years) so a generated random exam can't show the same question twice.
function collectUniqueQuestionPool(type, subtype, { newCurriculumOnly = false } = {}) {
  const seen = new Set();
  const pool = [];
  Object.keys(exams).forEach(id => {
    const e = exams[id];
    if (e.isRandom || e.type !== type || (subtype && e.subtype !== subtype)) return;
    if (newCurriculumOnly && !isNewCurriculumExam(e)) return;
    (e.questions || []).forEach(q => {
      const key = q.text.trim().toLowerCase().replace(/\s+/g, ' ');
      if (seen.has(key)) return;
      seen.add(key);
      pool.push(q);
    });
  });
  return pool;
}

function buildRandomExam(type, subtype, { newCurriculumOnly = false } = {}) {
  const pool = collectUniqueQuestionPool(type, subtype, { newCurriculumOnly });
  const shuffled = pool.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const questions = shuffled.slice(0, Math.min(RANDOM_EXAM_QUESTION_COUNT, shuffled.length));
  const label = subtype ? `${TYPE_LABELS[type] || type} ${SUBTYPE_LABELS[subtype] || subtype}` : (TYPE_LABELS[type] || type);
  const suffix = newCurriculumOnly ? ` (${NEW_CURRICULUM_MIN_YEAR}+ only)` : '';
  return { title: `${label} — Random Practice Exam${suffix}`, type, subtype, isRandom: true, questions };
}

function loadScores() {
  try {
    const raw = localStorage.getItem(SCORES_KEY);
    scores = raw ? JSON.parse(raw) : {};
    // migrate old format (a plain percentage number) to {best, last}
    Object.keys(scores).forEach(id => {
      if (typeof scores[id] === 'number') {
        scores[id] = { best: scores[id], last: scores[id] };
      }
    });
  } catch (e) {
    scores = {};
  }
}

function saveScores() {
  try {
    localStorage.setItem(SCORES_KEY, JSON.stringify(scores));
  } catch (e) {
    console.error('Could not save score history', e);
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    progress = raw ? JSON.parse(raw) : {};
  } catch (e) {
    progress = {};
  }
}

function saveProgress() {
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (e) {
    console.error('Could not save exam progress', e);
  }
}

function hasProgress(examId) {
  const p = progress[examId];
  if (!p) return false;
  return p.current > 0 || Object.keys(p.answers || {}).length > 0 || Object.keys(p.flags || {}).length > 0;
}

function clearProgress(examId) {
  if (progress[examId]) {
    delete progress[examId];
    saveProgress();
  }
}

// Snapshots quizState into localStorage on every quiz-screen render, so leaving
// (closing the tab, navigating away, exiting the exam) preserves where the user was.
function persistQuizProgress() {
  const e = exams[quizState.examId];
  if (!e || e.isRandom) return; // random exams regenerate their question pool each time, so there's nothing stable to resume into
  const meaningful = quizState.current > 0 || Object.keys(quizState.answers).length > 0 || Object.keys(quizState.flags).length > 0;
  if (!meaningful) {
    clearProgress(quizState.examId);
    return;
  }
  progress[quizState.examId] = {
    current: quizState.current,
    answers: quizState.answers,
    flags: quizState.flags,
    crossed: quizState.crossed,
    optionOrder: quizState.optionOrder,
    savedAt: Date.now(),
  };
  saveProgress();
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) settings = Object.assign(settings, JSON.parse(raw));
  } catch (e) {

  }
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) {
    console.error('Could not save settings', e);
  }
}

const SEASON_RANK = { winter: 0, spring: 1, summer: 2, fall: 3 };

function examSortKey(title) {
  const m = title.match(/\((Spring|Summer|Fall|Winter)\s+(\d{4})\)/i);
  if (!m) return null;
  return parseInt(m[2], 10) * 10 + (SEASON_RANK[m[1].toLowerCase()] ?? 0);
}

function renderList() {
  const type = view.type;
  const subtype = view.subtype;
  const ids = Object.keys(exams).filter(id => !exams[id].isRandom && exams[id].type === type && (!subtype || exams[id].subtype === subtype));
  ids.sort((a, b) => {
    const ka = examSortKey(exams[a].title);
    const kb = examSortKey(exams[b].title);
    if (ka != null && kb != null) return kb - ka; // most recent first
    if (ka != null) return -1;
    if (kb != null) return 1;
    return 0;
  });
  const backLabel = subtype ? `← Back to ${TYPE_LABELS[type] || type}` : '← Back to categories';
  const heading = subtype ? `${TYPE_LABELS[type] || type} ${SUBTYPE_LABELS[subtype] || subtype}` : `${TYPE_LABELS[type] || type} exams`;
  let html = `
    <div class="top-row"><button id="list-back-btn" class="back-btn">${backLabel}</button></div>
    <h1>${heading}</h1>
    <p class="subtitle">Pick an exam below to start practicing.</p>
  `;
  if (ids.length >= 2) {
    const hasOldCurriculum = ids.some(id => !isNewCurriculumExam(exams[id]));
    const hasNewCurriculum = ids.some(id => isNewCurriculumExam(exams[id]));
    const showCurriculumToggle = hasOldCurriculum && hasNewCurriculum;
    const newCurriculumOnly = showCurriculumToggle && settings.newCurriculumOnly;
    const eligibleCount = newCurriculumOnly ? ids.filter(id => isNewCurriculumExam(exams[id])).length : ids.length;
    const poolSize = collectUniqueQuestionPool(type, subtype, { newCurriculumOnly }).length;
    const genCount = Math.min(RANDOM_EXAM_QUESTION_COUNT, poolSize);
    const metaText = poolSize === 0
      ? `No questions available — no exams in this section match the ${NEW_CURRICULUM_MIN_YEAR}+ curriculum filter.`
      : `Draws ${genCount} questions from all ${eligibleCount} exam${eligibleCount !== 1 ? 's' : ''} in this section (${poolSize} unique questions available)`;
    html += `
      <div class="card random-exam-card">
        <div class="category-body">
          <div class="category-title">Random Practice Exam</div>
          <div class="category-meta">${metaText}</div>
          ${showCurriculumToggle ? `
            <label class="auto-next-toggle" id="new-curriculum-toggle-item" style="margin-top:6px;">
              <span>${NEW_CURRICULUM_MIN_YEAR}+ curriculum only</span>
              <span class="toggle-switch ${settings.newCurriculumOnly ? 'on' : ''}"></span>
            </label>
          ` : ''}
        </div>
        <button class="primary" data-action="generate-random" data-type="${type}" data-subtype="${subtype || ''}" ${genCount === 0 ? 'disabled' : ''}>Generate Random Exam</button>
      </div>
    `;
  }
  if (ids.length === 0) {
    html += `<div class="card empty-state">No exams in this category yet. Add some to exams.json in the repo.</div>`;
  } else {
    html += `<div class="exam-grid">`;
    ids.forEach(id => {
      const e = exams[id];
      const qCount = (e.questions || []).length;
      const s = scores[id];
      const scoreText = s ? `Best: ${s.best}% · Last: ${s.last}%` : 'Not attempted yet';
      const resuming = hasProgress(id);
      const metaText = resuming
        ? `${qCount} question${qCount !== 1 ? 's' : ''} · In progress — question ${progress[id].current + 1} of ${qCount}`
        : `${qCount} question${qCount !== 1 ? 's' : ''} · ${scoreText}`;
      html += `
        <div class="exam-card">
          <div class="category-body">
            <div class="category-title">${escapeHtml(e.title)}</div>
            <div class="category-meta">${metaText}</div>
          </div>
          <div class="exam-card-actions">
            ${e.issues ? `
              <div class="issue-wrap">
                <button type="button" class="icon-btn issue-btn ${openIssuePopoverId === id ? 'active' : ''}" data-action="toggle-issue" data-id="${id}" title="This exam has a known issue">!</button>
                ${openIssuePopoverId === id ? `<div class="issue-popover">${escapeHtml(e.issues)}</div>` : ''}
              </div>
            ` : ''}
            ${resuming ? `<button data-action="restart" data-id="${id}">Start over</button>` : ''}
            <button class="primary" data-action="${resuming ? 'resume' : 'take'}" data-id="${id}" ${qCount === 0 ? 'disabled' : ''}>${resuming ? 'Resume exam' : 'Take exam'}</button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    if (openIssuePopoverId) html += '<div class="menu-overlay" id="issue-overlay"></div>';
  }
  return html;
}

function renderMcOptions(q, selectedOi, { showFeedback = false, crossedForQ = {}, interactive = true, order } = {}) {
  const displayOrder = order || q.options.map((_, oi) => oi);
  let html = '';
  displayOrder.forEach(oi => {
    const opt = q.options[oi];
    const selected = selectedOi === oi ? 'selected' : '';
    const crossed = !!crossedForQ[oi];
    let feedbackClass = '';
    if (showFeedback) {
      if (oi === q.correct) feedbackClass = 'correct-answer';
      else if (oi === selectedOi) feedbackClass = 'incorrect-answer';
    }
    const locked = showFeedback || !interactive;
    html += `
      <label class="quiz-option ${selected} ${feedbackClass} ${crossed ? 'crossed-out' : ''} ${locked ? 'locked' : ''}" data-oi="${oi}">
        <span class="option-main">
          <input type="radio" name="quiz-answer" ${interactive ? '' : 'disabled'} ${selected ? 'checked' : ''} data-oi="${oi}">
          ${escapeHtml(opt)}
        </span>
        ${interactive ? `<button type="button" class="eye-toggle ${crossed ? 'active' : ''}" data-cross-oi="${oi}" title="${crossed ? 'Show option' : 'Hide option'}">${crossed ? EYE_CLOSED_SVG : EYE_OPEN_SVG}</button>` : ''}
      </label>
    `;
  });
  return html;
}

function renderFillBlanks(q, userAns, showFeedback) {
  const ans = Array.isArray(userAns) ? userAns : [];
  let html = '';
  q.blanks.forEach((alts, bi) => {
    const val = ans[bi] || '';
    const ok = showFeedback ? isBlankFilled(alts, val) : null;
    const cls = showFeedback ? (ok ? ' correct-answer' : ' incorrect-answer') : '';
    html += `
      <div class="fill-blank-row">
        <label class="fill-blank-label">${q.blanks.length > 1 ? `Answer ${bi + 1}` : 'Your answer'}</label>
        <input type="text" class="fill-blank-input${cls}" data-blank-index="${bi}" value="${escapeHtml(val)}" autocomplete="off" spellcheck="false" ${showFeedback ? 'disabled' : ''}>
        ${showFeedback && !ok ? `<div class="fill-blank-accepted">Accepted answer: ${escapeHtml(alts[0])}</div>` : ''}
      </div>
    `;
  });
  return html;
}

function renderFillBlanksReview(q, userAns) {
  const ans = Array.isArray(userAns) ? userAns : [];
  let html = '';
  q.blanks.forEach((alts, bi) => {
    const val = ans[bi] || '';
    const ok = isBlankFilled(alts, val);
    html += `
      <div class="fill-blank-row">
        <label class="fill-blank-label">${q.blanks.length > 1 ? `Answer ${bi + 1}` : 'Your answer'}</label>
        <input type="text" class="fill-blank-input ${ok ? 'correct-answer' : 'incorrect-answer'}" value="${escapeHtml(val || '(no answer)')}" disabled>
        ${!ok ? `<div class="fill-blank-accepted">Accepted answer: ${escapeHtml(alts[0])}</div>` : ''}
      </div>
    `;
  });
  return html;
}

function renderQuiz() {
  const e = exams[quizState.examId];
  const q = e.questions[quizState.current];
  const total = e.questions.length;
  const userAns = quizState.answers[quizState.current];
  const answered = isQuestionAnswered(q, userAns);
  const showFeedback = answered && settings.immediateGrading;
  const flagged = !!quizState.flags[quizState.current];
  const crossedForQ = quizState.crossed[quizState.current] || {};
  const bodyHtml = q.type === 'fill'
    ? renderFillBlanks(q, userAns, showFeedback)
    : renderMcOptions(q, userAns, { showFeedback, crossedForQ, order: quizState.optionOrder[quizState.current] });
  return `
    <div class="top-row quiz-top-row">
      <div class="options-wrap">
        <button id="options-menu-btn" class="bare-icon" title="Options">${MENU_SVG}</button>
        ${optionsMenuOpen ? `
          <div class="options-menu">
            <div class="options-menu-item" id="grading-toggle-item">
              <span>Grade immediately</span>
              <span class="toggle-switch ${settings.immediateGrading ? 'on' : ''}"></span>
            </div>
            <div class="options-menu-divider"></div>
            <div class="options-menu-item" id="menu-reset-btn">Reset exam</div>
            <div class="options-menu-item" id="menu-exit-btn">Exit exam</div>
          </div>
        ` : ''}
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="flag-btn" class="bare-icon flag-btn ${flagged ? 'active' : ''}" title="${flagged ? 'Unflag question' : 'Flag question'}">⚑</button>
        <span style="font-size:13px; color: var(--text-secondary);">Question ${quizState.current + 1} of ${total}</span>
      </div>
    </div>
    ${optionsMenuOpen ? '<div class="menu-overlay" id="menu-overlay"></div>' : ''}
    <div class="card">
      <p style="font-size:16px; font-weight:500; margin-top:0;">${escapeHtml(q.text)}</p>
      ${renderQuestionImage(q)}
      ${bodyHtml}
    </div>
    <div class="footer-row">
      <button id="prev-q-btn" ${quizState.current === 0 ? 'disabled' : ''}>Previous</button>
      <div class="footer-row-right">
        <label class="auto-next-toggle" id="auto-next-toggle-item">
          <span>Auto next</span>
          <span class="toggle-switch ${settings.autoNext ? 'on' : ''}"></span>
        </label>
        ${quizState.current === total - 1
          ? `<button class="primary" id="submit-quiz-btn">Submit exam</button>`
          : `<button class="primary" id="next-q-btn">Next</button>`}
      </div>
    </div>
    <div class="card qnav-wrap">
      ${renderQnav(false)}
    </div>
  `;
}

function renderQuestionImage(q) {
  if (!q.image) return '';
  return `<img class="question-image" src="${escapeHtml(q.image)}" alt="Figure for this question">`;
}

function renderQnav(forceGraded) {
  const e = exams[quizState.examId];
  let html = '<div class="qnav">';
  e.questions.forEach((q, i) => {
    const answered = isQuestionAnswered(q, quizState.answers[i]);
    const correct = answered && isQuestionCorrect(q, quizState.answers[i]);
    const flagged = !!quizState.flags[i];
    let cls = 'qnav-btn';
    if (i === quizState.current) cls += ' current';
    if (answered) cls += (forceGraded || settings.immediateGrading) ? (correct ? ' correct' : ' incorrect') : ' answered';
    if (flagged) cls += ' flagged';
    html += `<button type="button" class="${cls}" data-qnav="${i}">${i + 1}</button>`;
  });
  html += '</div>';
  return html;
}

function renderResults() {
  const e = exams[quizState.examId];
  const total = e.questions.length;
  let correctCount = 0;
  e.questions.forEach((q, i) => { if (isQuestionCorrect(q, quizState.answers[i])) correctCount++; });
  const pct = Math.round((correctCount / total) * 100);
  return `
    <div class="top-row"><button id="back-to-list-btn" class="back-btn">← Back to exams</button></div>
    <div class="card">
      <div class="score-big">${pct}%</div>
      <div class="score-label">${correctCount} of ${total} correct</div>
      <div style="display:flex; gap:8px; justify-content:center;">
        <button class="primary" id="retake-btn">Retake exam</button>
      </div>
    </div>
    ${renderReviewQuestion()}
  `;
}

function renderReviewQuestion() {
  const e = exams[quizState.examId];
  const q = e.questions[quizState.current];
  const total = e.questions.length;
  const userAns = quizState.answers[quizState.current];
  const flagged = !!quizState.flags[quizState.current];
  const bodyHtml = q.type === 'fill'
    ? renderFillBlanksReview(q, userAns)
    : renderMcOptions(q, userAns, { showFeedback: true, interactive: false, order: quizState.optionOrder[quizState.current] });
  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span style="font-size:13px; color: var(--text-secondary);">Question ${quizState.current + 1} of ${total}</span>
        ${flagged ? '<span style="font-size:13px; color:var(--flag);">⚑ Flagged</span>' : ''}
      </div>
      <p style="font-size:16px; font-weight:500; margin-top:0;">${escapeHtml(q.text)}</p>
      ${renderQuestionImage(q)}
      ${bodyHtml}
    </div>
    <div class="footer-row">
      <button id="review-prev-btn" ${quizState.current === 0 ? 'disabled' : ''}>Previous</button>
      <button id="review-next-btn" ${quizState.current === total - 1 ? 'disabled' : ''}>Next</button>
    </div>
    <div class="card qnav-wrap">
      ${renderQnav(true)}
    </div>
  `;
}

function attachHandlers() {
  const app = document.getElementById('app');

  if (view.screen === 'home') {
    app.querySelectorAll('[data-action="open-category"]').forEach(btn => {
      btn.onclick = () => {
        const type = btn.dataset.type;
        view = SUBTYPES_BY_TYPE[type] ? { screen: 'subcategory', type } : { screen: 'list', type };
        render();
      };
    });
  }

  if (view.screen === 'subcategory') {
    document.getElementById('back-to-home-btn').onclick = () => { view = { screen: 'home' }; render(); };
    app.querySelectorAll('[data-action="open-subcategory"]').forEach(btn => {
      btn.onclick = () => {
        view = { screen: 'list', type: btn.dataset.type, subtype: btn.dataset.subtype };
        render();
      };
    });
  }

  if (view.screen === 'list') {
    document.getElementById('list-back-btn').onclick = () => {
      openIssuePopoverId = null;
      view = view.subtype ? { screen: 'subcategory', type: view.type } : { screen: 'home' };
      render();
    };
    app.querySelectorAll('[data-action="take"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        quizState = { examId: id, current: 0, answers: {}, flags: {}, crossed: {}, optionOrder: buildOptionOrder(exams[id]) };
        optionsMenuOpen = false;
        openIssuePopoverId = null;
        view = { screen: 'quiz' };
        render();
      };
    });
    app.querySelectorAll('[data-action="resume"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const p = progress[id];
        quizState = { examId: id, current: p.current, answers: p.answers, flags: p.flags, crossed: p.crossed, optionOrder: p.optionOrder };
        optionsMenuOpen = false;
        openIssuePopoverId = null;
        view = { screen: 'quiz' };
        render();
      };
    });
    app.querySelectorAll('[data-action="restart"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        if (confirm('Start over? This clears your in-progress answers for this exam.')) {
          clearProgress(id);
          render();
        }
      };
    });
    const generateRandomBtn = app.querySelector('[data-action="generate-random"]');
    if (generateRandomBtn) generateRandomBtn.onclick = () => {
      const type = generateRandomBtn.dataset.type;
      const subtype = generateRandomBtn.dataset.subtype || undefined;
      const id = randomExamId(type, subtype);
      exams[id] = buildRandomExam(type, subtype, { newCurriculumOnly: settings.newCurriculumOnly });
      quizState = { examId: id, current: 0, answers: {}, flags: {}, crossed: {}, optionOrder: buildOptionOrder(exams[id]) };
      optionsMenuOpen = false;
      openIssuePopoverId = null;
      view = { screen: 'quiz' };
      render();
    };
    const newCurriculumToggle = document.getElementById('new-curriculum-toggle-item');
    if (newCurriculumToggle) newCurriculumToggle.onclick = () => {
      settings.newCurriculumOnly = !settings.newCurriculumOnly;
      saveSettings();
      render();
    };
    app.querySelectorAll('[data-action="toggle-issue"]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        openIssuePopoverId = openIssuePopoverId === id ? null : id;
        render();
      };
    });
    const issueOverlay = document.getElementById('issue-overlay');
    if (issueOverlay) issueOverlay.onclick = () => { openIssuePopoverId = null; render(); };
  }

  if (view.screen === 'quiz') {
    document.getElementById('options-menu-btn').onclick = (e) => {
      e.stopPropagation();
      optionsMenuOpen = !optionsMenuOpen;
      render();
    };
    const overlay = document.getElementById('menu-overlay');
    if (overlay) overlay.onclick = () => { optionsMenuOpen = false; render(); };
    const gradingToggle = document.getElementById('grading-toggle-item');
    if (gradingToggle) gradingToggle.onclick = () => {
      settings.immediateGrading = !settings.immediateGrading;
      saveSettings();
      render();
    };
    const menuResetBtn = document.getElementById('menu-reset-btn');
    if (menuResetBtn) menuResetBtn.onclick = () => {
      if (confirm('Reset this exam? This clears all your answers and flags.')) {
        quizState = { examId: quizState.examId, current: 0, answers: {}, flags: {}, crossed: {}, optionOrder: buildOptionOrder(exams[quizState.examId]) };
        optionsMenuOpen = false;
        render();
      }
    };
    const menuExitBtn = document.getElementById('menu-exit-btn');
    if (menuExitBtn) menuExitBtn.onclick = () => {
      view = listViewForExam(quizState.examId); quizState = null; optionsMenuOpen = false; render();
    };
    document.getElementById('flag-btn').onclick = () => {
      quizState.flags[quizState.current] = !quizState.flags[quizState.current];
      render();
    };
    const autoNextToggle = document.getElementById('auto-next-toggle-item');
    if (autoNextToggle) autoNextToggle.onclick = () => {
      settings.autoNext = !settings.autoNext;
      saveSettings();
      render();
    };
    app.querySelectorAll('.quiz-option').forEach(opt => {
      opt.onclick = (e) => {
        if (settings.immediateGrading && quizState.answers[quizState.current] !== undefined) { e.preventDefault(); return; }
        const oi = parseInt(opt.dataset.oi);
        const crossedForQ = quizState.crossed[quizState.current] || {};
        if (crossedForQ[oi]) { e.preventDefault(); return; }
        quizState.answers[quizState.current] = oi;
        const examId = quizState.examId;
        const qIndex = quizState.current;
        const isLast = qIndex === exams[examId].questions.length - 1;
        render();
        if (settings.autoNext && !isLast) {
          setTimeout(() => {
            if (quizState && quizState.examId === examId && quizState.current === qIndex && view.screen === 'quiz') {
              quizState.current++;
              render();
            }
          }, AUTO_NEXT_DELAY_MS);
        }
      };
    });
    app.querySelectorAll('.eye-toggle').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const oi = parseInt(btn.dataset.crossOi);
        if (!quizState.crossed[quizState.current]) quizState.crossed[quizState.current] = {};
        quizState.crossed[quizState.current][oi] = !quizState.crossed[quizState.current][oi];
        render();
      };
    });
    app.querySelectorAll('.qnav-btn').forEach(btn => {
      btn.onclick = () => {
        quizState.current = parseInt(btn.dataset.qnav);
        render();
      };
    });
    const prevBtn = document.getElementById('prev-q-btn');
    if (prevBtn) prevBtn.onclick = () => { quizState.current--; render(); };
    const nextBtn = document.getElementById('next-q-btn');
    if (nextBtn) nextBtn.onclick = () => { quizState.current++; render(); };
    app.querySelectorAll('.fill-blank-input').forEach(input => {
      // Deliberately does NOT re-render on plain input/blur: a full-DOM-replace
      // render() while focus is shifting between blank inputs (e.g. the
      // blur fired by focusing the next blank) can drop the focus/keystroke
      // that triggered it. Grading feedback appears when the user navigates
      // away from the question (Next/Previous/qnav) or presses Enter, both of
      // which already involve a deliberate re-render rather than a focus shift.
      input.oninput = (ev) => {
        const bi = parseInt(input.dataset.blankIndex);
        if (!Array.isArray(quizState.answers[quizState.current])) quizState.answers[quizState.current] = [];
        quizState.answers[quizState.current][bi] = ev.target.value;
      };
      input.onkeydown = (ev) => {
        if (ev.key === 'Enter' && settings.immediateGrading) {
          ev.preventDefault();
          render();
        }
      };
    });
    const submitBtn = document.getElementById('submit-quiz-btn');
    if (submitBtn) submitBtn.onclick = () => {
      const e = exams[quizState.examId];
      let correctCount = 0;
      e.questions.forEach((q, i) => { if (isQuestionCorrect(q, quizState.answers[i])) correctCount++; });
      const pct = Math.round((correctCount / e.questions.length) * 100);
      if (!e.isRandom) {
        const prevBest = scores[quizState.examId] ? scores[quizState.examId].best : pct;
        scores[quizState.examId] = { best: Math.max(prevBest, pct), last: pct };
        saveScores();
      }
      clearProgress(quizState.examId);
      quizState.current = 0;
      view = { screen: 'results' };
      render();
    };
  }

  if (view.screen === 'results') {
    document.getElementById('back-to-list-btn').onclick = () => {
      view = listViewForExam(quizState.examId); quizState = null; render();
    };
    document.getElementById('retake-btn').onclick = () => {
      quizState = { examId: quizState.examId, current: 0, answers: {}, flags: {}, crossed: {}, optionOrder: buildOptionOrder(exams[quizState.examId]) };
      optionsMenuOpen = false;
      view = { screen: 'quiz' };
      render();
    };
    app.querySelectorAll('.qnav-btn').forEach(btn => {
      btn.onclick = () => {
        quizState.current = parseInt(btn.dataset.qnav);
        render();
      };
    });
    const reviewPrevBtn = document.getElementById('review-prev-btn');
    if (reviewPrevBtn) reviewPrevBtn.onclick = () => { quizState.current--; render(); };
    const reviewNextBtn = document.getElementById('review-next-btn');
    if (reviewNextBtn) reviewNextBtn.onclick = () => { quizState.current++; render(); };
  }
}

(async function init() {
  loadScores();
  loadSettings();
  loadProgress();
  try {
    await loadExams();
    render();
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div class="card error-state">Could not load exams.json. Make sure it's in the same folder as this page.</div>
    `;
  }
})();
</script>
</body>
</html>
